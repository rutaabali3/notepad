<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Notes - Secure Notepad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="container-fluid h-100 p-0 d-flex vh-100">
        <!-- Sidebar -->
        <nav id="sidebar" class="bg-dark text-white d-flex flex-column p-3 col-auto"
            style="min-width: 250px; width: 250px;">
            <div class="d-flex align-items-center mb-4 text-decoration-none text-white">
                <i class="bi bi-journal-richtext fs-4 me-2"></i>
                <span class="fs-4 fw-bold">MyNotes</span>
            </div>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="notepad.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-pencil-square me-2"></i> Notepad
                    </a>
                </li>
                <li>
                    <a href="saved-notes.html" class="nav-link active w-100 text-start d-flex align-items-center">
                        <i class="bi bi-archive me-2"></i> Saved Notes
                    </a>
                </li>
                <li>
                    <a href="settings.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-gear me-2"></i> Settings
                    </a>
                </li>
            </ul>
            <hr class="text-secondary">
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle px-2"
                    id="dropdownUser" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle fs-5 me-2"></i>
                    <strong id="current-user-name">User</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                    <li><button class="dropdown-item" id="logout-btn">Sign out</button></li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow-1 h-100 bg-white position-relative p-4" style="overflow-y: auto;">
            <h2 class="mb-4 d-flex align-items-center">
                <i class="bi bi-archive me-2 text-dark"></i> Saved Notes
            </h2>
            <div class="input-group mb-3 w-50">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" id="search-notes" class="form-control border-start-0 ps-0"
                    placeholder=" Search notes...">
            </div>
            <div id="notes-list" class="row g-3">
                <div class="col-12 text-center text-muted mt-5">Loading notes...</div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/storage.js"></script>
    <script src="js/saved-notes.js"></script>
</body>

</html>
