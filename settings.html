<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Secure Notepad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="container-fluid h-100 p-0 d-flex vh-100">
        <!-- Sidebar -->
        <nav id="sidebar" class="bg-dark text-white d-flex flex-column p-3 col-auto"
            style="min-width: 250px; width: 250px;">
            <div class="d-flex align-items-center mb-4 text-decoration-none text-white">
                <i class="bi bi-journal-richtext fs-4 me-2"></i>
                <span class="fs-4 fw-bold">MyNotes</span>
            </div>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="notepad.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-pencil-square me-2"></i> Notepad
                    </a>
                </li>
                <li>
                    <a href="saved-notes.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-archive me-2"></i> Saved Notes
                    </a>
                </li>
                <li>
                    <a href="settings.html" class="nav-link active w-100 text-start d-flex align-items-center">
                        <i class="bi bi-gear me-2"></i> Settings
                    </a>
                </li>
            </ul>
            <hr class="text-secondary">
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle px-2"
                    id="dropdownUser" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle fs-5 me-2"></i>
                    <strong id="current-user-name">User</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                    <li><button class="dropdown-item" id="logout-btn">Sign out</button></li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow-1 h-100 bg-white position-relative p-4 w-75 mx-auto" style="overflow-y: auto;">
            <h2 class="mb-4 nav-header"><i class="bi bi-sliders me-2"></i> App Settings</h2>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-person-badge me-2 text-secondary"></i>Account Information</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label text-muted">Username</label>
                        <div class="col-sm-9">
                            <input type="text" readonly class="ps-2 form-control-plaintext fw-bold" id="settings-username"
                                value="...">
                        </div>
                    </div>
                    <div class="row">
                        <label class="col-sm-3 col-form-label text-muted">Account ID</label>
                        <div class="col-sm-9">
                            <input type="text" readonly class="ps-2 form-control-plaintext font-monospace text-muted"
                                id="settings-uid" value="...">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="mb-0"><i class="bi bi-shield-exclamation me-2"></i>Danger Zone</h5>
                </div>
                <div class="card-body">
                    <p class="card-text">Deleting your account is permanent. All saved notes will be erased immediately.
                    </p>
                    <button id="btn-delete-account" class="btn btn-outline-danger">Delete Account</button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/storage.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
