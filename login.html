<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Notepad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body">
    <section class="container-fluid d-flex justify-content-center align-items-center vh-100 p-0 m-0">
        <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
            <div class="card-body text-center">
                <i class="bi bi-journal-locked fs-1 text-primary mb-3"></i>
                <h2 class="card-title fw-bold mb-4">Secure Notepad</h2>

                <div id="auth-forms">
                    <!-- Login Form -->
                    <form id="login-form">
                        <div class="mb-3 text-start">
                            <label for="login-username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="login-username" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label for="login-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                        <p class="small text-muted">Don't have an account? <a href="#" id="show-register">Register</a>
                        </p>
                    </form>

                    <!-- Register Form (Hidden by default) -->
                    <form id="register-form" class="d-none">
                        <div class="mb-3 text-start">
                            <label for="reg-username" class="form-label">Choose Username</label>
                            <input type="text" class="form-control" id="reg-username" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label for="reg-password" class="form-label">Create Password</label>
                            <input type="password" class="form-control" id="reg-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
                        <p class="small text-muted">Already have an account? <a href="#" id="show-login">Login</a></p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/storage.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
