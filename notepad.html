<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad - MyNotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="mobile-topbar">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle menu" aria-controls="sidebar" aria-expanded="false">
            <i class="bi bi-list"></i>
        </button>
        <a href="notepad.html"><i class="bi bi-journal-richtext"></i><span>MyNotes</span></a>
    </div>
    <div id="sidebar-backdrop" class="sidebar-backdrop" tabindex="-1"></div>
    <div class="container-fluid h-100 p-0 d-flex vh-100">
        <nav id="sidebar" class="bg-dark text-white d-flex flex-column p-3 col-auto" style="min-width: 250px; width: 250px;">
            <a href="notepad.html" class="d-flex align-items-center mb-4 text-decoration-none text-white">
                <i class="bi bi-journal-richtext fs-4 me-2"></i>
                <span class="fs-4 fw-bold">MyNotes</span>
            </a>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="notepad.html" class="nav-link active w-100 text-start d-flex align-items-center">
                        <i class="bi bi-pencil-square me-2"></i> Notepad
                    </a>
                </li>
                <li>
                    <a href="saved-notes.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-archive me-2"></i> Saved Notes
                    </a>
                </li>
                <li>
                    <a href="settings.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-gear me-2"></i> Settings
                    </a>
                </li>
            </ul>
            <hr class="text-secondary">
            <div class="small text-white-50 px-2">
                <i class="bi bi-shield-check me-1"></i> Local-only storage
            </div>
            <div class="small text-white-50 px-2 mt-1">Notes stay in this browser.</div>
        </nav>

        <main class="flex-grow-1 h-100 bg-white position-relative" style="overflow-y: auto;">
            <div class="h-100 d-flex flex-column p-4">
                <div class="row mb-3 align-items-center" id="note-header">
                    <div class="col-9">
                        <input type="text" id="note-title" class="form-control form-control-lg border-0 bg-transparent fw-bold w-100" placeholder="Untitled Note" aria-label="Note title">
                        <small id="save-status" class="text-muted ms-1">Ready to write</small>
                    </div>
                    <div class="col-3 text-end">
                        <button id="btn-save" class="btn btn-success w-100">SAVED</button>
                    </div>
                </div>
                <div class="stats-row d-flex flex-wrap gap-2 mb-2" aria-label="Text statistics">
                    <span class="stat-chip"><i class="bi bi-type me-1"></i>Words: <b id="stat-words">0</b></span>
                    <span class="stat-chip"><i class="bi bi-body-text me-1"></i>Characters: <b id="stat-chars">0</b></span>
                    <span class="stat-chip"><i class="bi bi-chat-text me-1"></i>Sentences: <b id="stat-sentences">0</b></span>
                    <span class="stat-chip"><i class="bi bi-clock me-1"></i>Reading: <b id="stat-reading">0 min</b></span>
                </div>
                <div class="editor-shell flex-grow-1 border overflow-hidden d-flex flex-column">
                    <div id="editor-toolbar" class="editor-toolbar d-flex flex-wrap align-items-center gap-1 p-2" role="toolbar" aria-label="Text formatting">
                        <button type="button" class="editor-tool" data-command="bold" title="Bold" aria-label="Bold"><i class="bi bi-type-bold"></i></button>
                        <button type="button" class="editor-tool" data-command="italic" title="Italic" aria-label="Italic"><i class="bi bi-type-italic"></i></button>
                        <button type="button" class="editor-tool" data-command="underline" title="Underline" aria-label="Underline"><i class="bi bi-type-underline"></i></button>
                        <span class="editor-divider" aria-hidden="true"></span>
                        <button type="button" class="editor-tool" data-command="formatBlock" data-value="<h2>" title="Heading" aria-label="Heading"><i class="bi bi-type-h2"></i></button>
                        <button type="button" class="editor-tool" data-command="formatBlock" data-value="<blockquote>" title="Quote" aria-label="Quote"><i class="bi bi-quote"></i></button>
                        <button type="button" class="editor-tool" data-command="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list"><i class="bi bi-list-ul"></i></button>
                        <button type="button" class="editor-tool" data-command="insertOrderedList" title="Numbered list" aria-label="Numbered list"><i class="bi bi-list-ol"></i></button>
                        <span class="editor-divider" aria-hidden="true"></span>
                        <button type="button" class="editor-tool" id="btn-add-link" title="Add link" aria-label="Add link"><i class="bi bi-link-45deg"></i></button>
                        <button type="button" class="editor-tool" data-command="unlink" title="Remove link" aria-label="Remove link"><i class="bi bi-link-45deg"></i><span class="unlink-mark">×</span></button>
                        <button type="button" class="editor-tool" data-command="removeFormat" title="Clear formatting" aria-label="Clear formatting"><i class="bi bi-eraser"></i></button>
                        <span class="editor-divider" aria-hidden="true"></span>
                        <button type="button" class="editor-tool" id="btn-spell-check" title="Check spelling" aria-label="Check spelling"><i class="bi bi-spellcheck"></i></button>
                    </div>
                    <div id="note-content" class="form-control w-100 flex-grow-1 p-3" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Start writing here..." spellcheck="false"></div>
                </div>
                <div id="spell-panel" class="spell-panel border" hidden>
                    <div class="spell-panel-header d-flex justify-content-between align-items-center p-2">
                        <span><i class="bi bi-spellcheck me-2"></i>Spelling suggestions (<span id="spell-count">0</span>)</span>
                        <button type="button" id="btn-clear-spell" class="btn btn-sm btn-outline-dark">Clear</button>
                    </div>
                    <ul id="spell-list" class="spell-list"></ul>
                </div>
                <div id="spell-tooltip" class="spell-tooltip" hidden></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/theme.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/spellcheck.js"></script>
    <script src="js/notepad.js"></script>
</body>

</html>
