<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad - MyNotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="container-fluid h-100 p-0 d-flex vh-100">
        <nav id="sidebar" class="bg-dark text-white d-flex flex-column p-3 col-auto" style="min-width: 250px; width: 250px;">
            <a href="notepad.html" class="d-flex align-items-center mb-4 text-decoration-none text-white">
                <i class="bi bi-journal-richtext fs-4 me-2"></i>
                <span class="fs-4 fw-bold">MyNotes</span>
            </a>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="notepad.html" class="nav-link active w-100 text-start d-flex align-items-center">
                        <i class="bi bi-pencil-square me-2"></i> Notepad
                    </a>
                </li>
                <li>
                    <a href="saved-notes.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-archive me-2"></i> Saved Notes
                    </a>
                </li>
                <li>
                    <a href="settings.html" class="nav-link text-white w-100 text-start d-flex align-items-center">
                        <i class="bi bi-gear me-2"></i> Settings
                    </a>
                </li>
            </ul>
            <hr class="text-secondary">
            <div class="small text-white-50 px-2">
                <i class="bi bi-shield-check me-1"></i> Local-only storage
            </div>
            <div class="small text-white-50 px-2 mt-1">Notes stay in this browser.</div>
        </nav>

        <main class="flex-grow-1 h-100 bg-white position-relative" style="overflow-y: auto;">
            <div class="h-100 d-flex flex-column p-4">
                <div class="row mb-3 align-items-center">
                    <div class="col-9">
                        <input type="text" id="note-title" class="form-control form-control-lg border-0 bg-transparent fw-bold w-100" placeholder="Untitled Note" aria-label="Note title">
                        <small id="save-status" class="text-muted ms-1">Ready to write</small>
                    </div>
                    <div class="col-3 text-end">
                        <button id="btn-save" class="btn btn-success w-100">SAVED</button>
                    </div>
                </div>
                <div class="flex-grow-1 border overflow-hidden">
                    <textarea id="note-content" class="form-control w-100 h-100 border-0 p-3" style="resize: none; outline: none; box-shadow: none;" placeholder="Start writing here..." aria-label="Note content"></textarea>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/storage.js"></script>
    <script src="js/notepad.js"></script>
</body>

</html>
